# Configure an adopting project's actual workers and checks here.
# Intent belongs to PROJECT.md; acceptance belongs to phase CONTEXT.
execution:
  max_parallel: 3
  worker_timeout_seconds: 3600
  check_timeout_seconds: 300
  # argv lists, without a shell. Each invocation gets one fresh assignment.
  # Workers commit SUMMARY; do not overwrite it with CLI output after a commit.
  worker_command:
    - codex
    - -a
    - never
    - exec
    - --ephemeral
    - --sandbox
    - "{sandbox}"
    - -C
    - "{worktree}"
    - "-"
  # Optional documentor_command can select a separate route; otherwise the same
  # executable receives the documentor role and its bounded documentation scope.
  verifier_command:
    - codex
    - -a
    - never
    - exec
    - --ephemeral
    - --sandbox
    - "{sandbox}"
    - -C
    - "{worktree}"
    - --output-last-message
    - "{result}"
    - "-"
  # Nonsecret adapter settings only. Use the host environment for credentials.
  environment: {}

verification:
  # Required before run/verify/publish. Configure meaningful project checks.
  commands: []
    # - [python, -m, unittest, discover, -s, tests, -v]
    # - [npm, test, --, --run]

publication:
  remote: origin
  base_branch: main
  # Names to inspect in GitHub's statusCheckRollup. Publication can start CI;
  # readiness is separate and requires successful observations of these checks.
  required_checks: []
