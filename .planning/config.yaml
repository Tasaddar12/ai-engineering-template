# Project execution settings read by .ai/runtime/phase.py.
# Intent belongs to PROJECT.md; acceptance belongs to phase CONTEXT.
# Every key below has a working default — set only what this project overrides.

# Commit planning records as the workflows produce them. Set false to make every
# commit verb a no-op and leave staging to the user.
commit_docs: true

# When set, workflows present user-facing output in this language. Technical
# terms, code, file paths and subagent prompts stay in English.
response_language: null

# Drives how much cross-phase context agents receive. At 500000 or above,
# planners and executors are given prior phase summaries and decisions.
context_window: 200000

workflow:
  # Replace AskUserQuestion with plain-text numbered lists. Required on runtimes
  # that do not provide an interactive question API.
  text_mode: false
  # Let a workflow continue into the next step without being asked again.
  auto_advance: false
  discuss_mode: discuss

# Per-agent model overrides. Omitted agents use the model in their own
# definition under .ai/agents/, falling back to the host's choice.
agents: {}
  # coder:
  #   model: opus
  # verifier:
  #   model: sonnet

verification:
  # The project's real checks, as argv lists without a shell. Run by
  # `phase_run query verification.run-checks` during execute, verify and ship.
  #
  # CHANGEME: this is empty until onboarding configures actual commands. While it
  # is empty, phases are verified by reading alone and the verification report
  # must say so.
  commands: []
    # - [python, -m, unittest, discover, -s, tests, -v]
    # - [npm, test, --, --run]
