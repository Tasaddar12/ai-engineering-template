# Project execution settings read by .ai/runtime/phase.py.
# Intent belongs to PROJECT.md; acceptance belongs to phase CONTEXT.
# Every key below has a working default — set only what this project overrides.

# Commit planning records as the workflows produce them. Set false to make every
# commit verb a no-op and leave staging to the user.
commit_docs: true

# When set, workflows present user-facing output in this language. Technical
# terms, code, file paths and subagent prompts stay in English.
response_language: null

# The context window of the model the agents actually run on. It sets the
# handoff threshold below as well as how much cross-phase context agents
# receive: at 500000 or above, planners and executors are given prior phase
# summaries and decisions. Understating it is not the safe direction -- a
# 200000 here on a 1M-token model stops every agent at 120000 tokens, an eighth
# of what it can hold, and a researcher reads its way there in a few fetches.
# Set 200000 only on a host whose models really have a 200k window.
context_window: 1000000

workflow:
  # Replace AskUserQuestion with plain-text numbered lists. Required on runtimes
  # that do not provide an interactive question API.
  text_mode: false
  # Let a workflow continue into the next step without being asked again.
  auto_advance: false
  discuss_mode: discuss
  # WHICH isolation model to use, never whether to isolate. Every executor runs
  # in its own worktree; there is no setting that turns that off. `auto` reads
  # the model from the installed host -- Claude Code binds its own worktree,
  # any other host has the runtime create one. The only other accepted values
  # are harness-worktree and orchestrator-worktree. Anything else, including
  # none/null/false, is an error rather than a silent fallback.
  isolation: auto

worktree:
  # Where runtime-created checkouts live, relative to the primary checkout.
  # It must be gitignored; execution stops with that instruction if it is not.
  root: .worktrees

# When an agent must stop taking new work and write a handoff. The trigger is
# whichever of these comes first, measured against actual transcript occupancy:
# 60% of context_window above, or the absolute token ceiling. At the 1000000
# window above the ceiling binds at 250000; on a 200000-token host the
# percentage binds first, at 120000. Handoff records land in .planning/handoffs/, which is
# gitignored -- they are local, ephemeral, and deleted once consumed.
handoff:
  context_percent: 60
  context_tokens: 250000

# How far a .planning/codebase/ map may drift before /plan-phase regenerates it,
# measured in commits that touched that map's own sources since the revision it
# was stamped with. Writes under .planning/ never count: a phase write-up is not
# a change to the architecture it describes.
#
#   stack         1  -- a dependency change is a stack change, so a manifest,
#                       lockfile, Dockerfile, CI workflow or version pin moving
#                       at all makes STACK.md wrong about what runs
#   architecture 15  -- ordinary churn is not a changed architecture; sustained
#                       movement is
#
# `phase_run query codebase.status` reports the current answer.
codebase:
  staleness:
    stack: 1
    architecture: 15

# Per-agent model and effort overrides, and the only place a Claude subagent's
# model is set. Agent definitions under .ai/agents/ deliberately carry no
# `model:` or `effort:` frontmatter, so a role omitted here resolves to
# `inherit` and runs on whatever the orchestrator's own session is using.
#
# Models are the host's aliases -- `opus`, `sonnet`, `haiku` or `fable` -- not
# full API ids. The Agent SDK's dispatch call accepts only an alias, so a full
# id such as `claude-opus-5-5` cannot be passed through.
#
# The tiers follow the work rather than the role name:
#
#   opus     the phase itself -- planning it, writing it, researching
#            it, reviewing it and verifying it, where a miss is not
#            caught by anything downstream and costs the whole phase
#   sonnet   the work around it -- debugging, documentation, mapping
#            and checking claims against their actual output, where a
#            miss surfaces immediately and costs one pass
#
# `effort` is the second dial: how hard the chosen model thinks, on the scale
# low / medium / high / xhigh / max. It is the cheaper dial of the two -- a role
# gains more from `high` than from a larger model, at a fraction of the cost of
# moving it up a tier. Every role that produces something runs at `high`; the
# two that only check what already exists run at `medium`, because reading an
# artifact against a stated claim is bounded work and more thinking does not
# find more of it.
#
# `coordinator` is deliberately absent: it is the orchestrating conversation,
# not a worker the runtime spawns, so it keeps the session's own model.
#
# This block is Claude's. Codex reads its own `model` and `model_reasoning_effort`
# from each role's TOML in .codex/agents/ and ignores everything here.
agents:
  coder:
    model: opus
    effort: high
  debugger:
    model: sonnet
    effort: high
  doc-writer:
    model: sonnet
    effort: high
  phase-preparer:
    model: opus
    effort: high
  codebase-mapper:
    model: sonnet
    effort: high
  researcher:
    model: opus
    effort: high
  code-reviewer:
    model: opus
    effort: high
  verifier:
    model: opus
    effort: high
  phase-checker:
    model: opus
    effort: high
  doc-verifier:
    model: sonnet
    effort: medium
  integration-checker:
    model: sonnet
    effort: medium

verification:
  # The project's real checks, as argv lists without a shell. Run by
  # `phase_run query verification.run-checks` during execute, verify and ship.
  #
  # CHANGEME: this is empty until onboarding configures actual commands. While it
  # is empty, phases are verified by reading alone and the verification report
  # must say so.
  commands: []
    # - [python, -m, unittest, discover, -s, tests, -v]
    # - [npm, test, --, --run]
