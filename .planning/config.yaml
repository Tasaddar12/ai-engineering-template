# Project execution settings read by .ai/runtime/phase.py.
# Intent belongs to PROJECT.md; acceptance belongs to phase CONTEXT.
# Every key below has a working default — set only what this project overrides.

# Commit planning records as the workflows produce them. Set false to make every
# commit verb a no-op and leave staging to the user.
commit_docs: true

# When set, workflows present user-facing output in this language. Technical
# terms, code, file paths and subagent prompts stay in English.
response_language: null

# Drives how much cross-phase context agents receive. At 500000 or above,
# planners and executors are given prior phase summaries and decisions.
context_window: 200000

workflow:
  # Replace AskUserQuestion with plain-text numbered lists. Required on runtimes
  # that do not provide an interactive question API.
  text_mode: false
  # Let a workflow continue into the next step without being asked again.
  auto_advance: false
  discuss_mode: discuss
  # WHICH isolation model to use, never whether to isolate. Every executor runs
  # in its own worktree; there is no setting that turns that off. `auto` reads
  # the model from the installed host -- Claude Code binds its own worktree,
  # any other host has the runtime create one. The only other accepted values
  # are harness-worktree and orchestrator-worktree. Anything else, including
  # none/null/false, is an error rather than a silent fallback.
  isolation: auto

worktree:
  # Where runtime-created checkouts live, relative to the primary checkout.
  # It must be gitignored; execution stops with that instruction if it is not.
  root: .worktrees

# When an agent must stop taking new work and write a handoff. The trigger is
# whichever of these comes first, measured against actual transcript occupancy:
# 60% of context_window above, or the absolute token ceiling. At the 200000
# window above the percentage binds at 120000; on a 1000000-token host the
# ceiling binds first. Handoff records land in .planning/handoffs/, which is
# gitignored -- they are local, ephemeral, and deleted once consumed.
handoff:
  context_percent: 60
  context_tokens: 250000

# How far a .planning/codebase/ map may drift before /plan-phase regenerates it,
# measured in commits that touched that map's own sources since the revision it
# was stamped with. Writes under .planning/ never count: a phase write-up is not
# a change to the architecture it describes.
#
#   stack         1  -- a dependency change is a stack change, so a manifest,
#                       lockfile, Dockerfile, CI workflow or version pin moving
#                       at all makes STACK.md wrong about what runs
#   architecture 15  -- ordinary churn is not a changed architecture; sustained
#                       movement is
#
# `phase_run query codebase.status` reports the current answer.
codebase:
  staleness:
    stack: 1
    architecture: 15

# Per-agent model overrides, and the only place a Claude subagent's model is
# set. Agent definitions under .ai/agents/ deliberately carry no `model:`
# frontmatter, so a role omitted here resolves to `inherit` and runs on whatever
# model the orchestrator's own session is using.
#
# The tiers follow the work rather than the role name:
#
#   sonnet  authoring -- writing code, plans and prose against a settled
#           decision, where the hard thinking already happened upstream
#   opus    judgement -- research and independent review, where a miss is not
#           caught by anything downstream and costs a whole phase
#   haiku   mechanical -- running the project's commands and checking claims
#           against their actual output
#
# `coordinator` is deliberately absent: it is the orchestrating conversation,
# not a worker the runtime spawns, so it keeps the session's own model.
#
# These are Claude aliases. Codex reads its own `model` from each role's TOML in
# .codex/agents/ and ignores this block entirely.
agents:
  coder:
    model: sonnet
  debugger:
    model: sonnet
  doc-writer:
    model: sonnet
  phase-preparer:
    model: sonnet
  codebase-mapper:
    model: sonnet
  researcher:
    model: opus
  code-reviewer:
    model: opus
  verifier:
    model: opus
  phase-checker:
    model: opus
  doc-verifier:
    model: haiku
  integration-checker:
    model: haiku

verification:
  # The project's real checks, as argv lists without a shell. Run by
  # `phase_run query verification.run-checks` during execute, verify and ship.
  #
  # CHANGEME: this is empty until onboarding configures actual commands. While it
  # is empty, phases are verified by reading alone and the verification report
  # must say so.
  commands: []
    # - [python, -m, unittest, discover, -s, tests, -v]
    # - [npm, test, --, --run]
