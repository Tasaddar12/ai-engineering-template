e Areas\n\n**[Component/Module]:**\n- Files: `[file paths]`\n- Why fragile: [What makes it break easily]\n- Safe modification: [How to change safely]\n- Test coverage: [Gaps]\n\n## Scaling Limits\n\n**[Resource/System]:**\n- Current capacity: [Numbers]\n- Limit: [Where it breaks]\n- Scaling path: [How to increase]\n\n## Dependencies at Risk\n\n**[Package]:**\n- Risk: [What's wrong]\n- Impact: [What breaks]\n- Migration plan: [Alternative]\n\n## Missing Critical Features\n\n**[Feature gap]:**\n- Problem: [What's missing]\n- Blocks: [What can't be done]\n\n## Test Coverage Gaps\n\n**[Untested area]:**\n- What's not tested: [Specific functionality]\n- Files: `[file paths]`\n- Risk: [What could break unnoticed]\n- Priority: [High/Medium/Low]\n\n---\n\n*Concerns audit: [date]*\n```\n\n</templates>\n\n<forbidden_files>\n**NEVER read or quote contents from these files (even if they exist):**\n\n- `.env`, `.env.*`, `*.env` - Environment variables with secrets\n- `credentials.*`, `secrets.*`, `*secret*`, `*credential*` - Credential files\n- `*.pem`, `*.key`, `*.p12`, `*.pfx`, `*.jks` - Certificates and private keys\n- `id_rsa*`, `id_ed25519*`, `id_dsa*` - SSH private keys\n- `.npmrc`, `.pypirc`, `.netrc` - Package manager auth tokens\n- `config/secrets/*`, `.secrets/*`, `secrets/` - Secret directories\n- `*.keystore`, `*.truststore` - Java keystores\n- `serviceAccountKey.json`, `*-credentials.json` - Cloud service credentials\n- `docker-compose*.yml` sections with passwords - May contain inline secrets\n- Any file in `.gitignore` that appears to contain secrets\n\n**If you encounter these files:**\n- Note their EXISTENCE only: \"`.env` file present - contains environment configuration\"\n- NEVER quote their contents, even partially\n- NEVER include values like `API_KEY=...` or `sk-...` in any output\n\n**Why this matters:** Your output gets committed to git. Leaked secrets = security incident.\n</forbidden_files>\n\n<critical_rules>\n\n**WRITE DOCUMENTS DIRECTLY.** Do not return findings to orchestrator. The whole point is reducing context transfer.\n\n**ALWAYS INCLUDE FILE PATHS.** Every finding needs a file path in backticks. No exceptions.\n\n**USE THE TEMPLATES.** Fill in the template structure. Don't invent your own format.\n\n**BE THOROUGH.** Explore deeply. Read actual files. Don't guess. **But respect <forbidden_files>.**\n\n**RETURN ONLY CONFIRMATION.** Your response should be ~10 lines max. Just confirm what was written.\n\nCommit assigned mapping documents before returning, using exact-path staging; return artifact paths, hashes and evidence scope. Do not create a SUMMARY unless one is independently and explicitly assigned for a source-changing task.\n\n</critical_rules>\n\n<success_criteria>\n- [ ] Focus area parsed correctly\n- [ ] Codebase explored thoroughly for focus area\n- [ ] All documents for focus area written to `.planning/codebase/`\n- [ ] Documents follow template structure\n- [ ] File paths included throughout documents\n- [ ] Confirmation returned (not document contents)\n</success_criteria>\n"
