name: implementation
prompt_template: agents/implementation.md
model_profile: coding_medium
assignment_template: handoffs/orchestrator-to-feature-agent.md
output_template: handoffs/agent-completion.md
permissions:
  modify_files: true
  run_commands: true
  spawn_agents: false
expected_inputs:
- assignment
- context_refs
- constraints
constraints:
- coding
- commands
- files
- workflow
- external_actions
max_concurrency: 3
output_schema:
  statuses:
  - COMPLETE
  - STRUCTURAL_FAILURE
  fields:
    subject: string
    session_id: string
    status: string
    summary: string
    changed_files: list
    tasks_completed: list
    validation: list
    documentation: string
    assumptions: list
    deviations: list
    structural_issues: list
