version: 0.3.0
base_branch: main
max_parallel: 3
batching:
  max_tasks: 5
  max_effort: 8
max_review_iterations: 3
max_recovery_attempts: 3
agent_timeout: 1800
providers:
  codex:
    executable: codex
    configured: false
    permissions_profiles:
      workspace_write: ai-engineering-workspace-write
      output_only: ai-engineering-output-only
    read_only_runtime: []
    uses_credentials: true
    paid: true
  command:
    argv: []
    configured: false
    confinement:
      mechanism: bubblewrap
    read_only_runtime: []
    uses_credentials: false
    paid: false
delivery:
  remote: origin
  base_branch: main
  create_pr: true
  required_checks: []
  required_approvals: 0
assets:
  manifest: .ai/framework-manifest.yaml
  roots:
  - agents
  - templates
  - workflows
  - constraints
