coding:
  python: '>=3.11'
  typing: Type public boundaries; keep YAML metadata explicit.
  format: ruff format
  lint: ruff check
  tests: Test changed behavior, edge cases and regressions; no mirrored implementation
    tests.
  error_handling: Raise actionable FrameworkError; never invent success.
  logging: Capture bounded command evidence; redact configured secrets.
  dependencies: Small declared dependencies; no runtime package installation.
  documentation: Update behavior/config/API docs with changes.
  generated_files: Do not edit generated outputs by hand.
commands:
  default: deny
  expected:
  - tests
  - lint
  - format
  - types
  rules:
  - argv_prefix:
    - git
    - push
    - --force
    effect: forbid
  - argv_prefix:
    - git
    - reset
    - --hard
    effect: forbid
  - argv_prefix:
    - git
    - status
    effect: allow
  - argv_prefix:
    - git
    - diff
    effect: allow
  - argv_prefix:
    - git
    - log
    effect: allow
  - argv_prefix:
    - git
    - rev-parse
    effect: allow
  - argv_prefix:
    - git
    - worktree
    effect: allow
  - argv_prefix:
    - git
    - merge-base
    effect: allow
  - argv_prefix:
    - git
    - show-ref
    effect: allow
  - argv_prefix:
    - git
    - check-ref-format
    effect: allow
  - argv_prefix:
    - git
    - ls-files
    effect: allow
  - argv_prefix:
    - git
    - branch
    effect: allow
  - argv_prefix:
    - git
    - add
    effect: allow
  - argv_prefix:
    - git
    - commit
    effect: allow
  - argv_prefix:
    - python
    - -m
    - pytest
    effect: allow
  - argv_prefix:
    - python
    - -m
    - ruff
    effect: allow
  - argv_prefix:
    - python
    - -m
    - mypy
    effect: allow
  - argv_prefix:
    - git
    - push
    effect: approval
    action: push
  - argv_prefix:
    - gh
    - pr
    - create
    effect: approval
    action: pull_request
  - argv_prefix:
    - gh
    - pr
    - view
    effect: allow
  - argv_prefix:
    - gh
    - pr
    - list
    effect: allow
files:
  read_only:
  - .git
  - .ai/STATE.yaml
  - .ai/constraints.yaml
  - .ai/models.yaml
  - .ai/framework.yaml
  - .ai/agents
  - .ai/archive
  forbidden:
  - .env
  - .env.*
  - '**/*.pem'
  - '**/*.key'
  generated: []
  preserve:
  - migrations
  specialized_review: []
workflow:
  validation_before_review: true
  review_before_pr: true
  dependencies_before_start: true
  reviewer_read_only: true
  independent_reviewer: true
  cleanup_requires_evidence: true
  planning_artifacts_under_ai: true
  plan_requires_tasks_and_features: true
external_actions:
  commit: allow
  push: approval
  pull_request: approval
  merge: approval
  release: approval
  deployment: approval
  paid_service: approval
  credentials: approval
  destructive: forbid
  provider_execution: approval
execution:
  max_output_chars: 65536
  redact_env:
  - OPENAI_API_KEY
  - ANTHROPIC_API_KEY
  - GH_TOKEN
  - GITHUB_TOKEN
  allow_shell: false
