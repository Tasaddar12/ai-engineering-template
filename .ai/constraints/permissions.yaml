version: 1
roles:
  orchestrator:
    modify_files: false
    run_commands: true
    spawn_agents: true
    commands: [tests, lint, format, types]
  work_decomposition:
    modify_files: false
    run_commands: false
    spawn_agents: false
    commands: []
  implementation:
    modify_files: true
    run_commands: true
    spawn_agents: false
    commands: [tests, lint, format, types]
  bugfix:
    modify_files: true
    run_commands: true
    spawn_agents: false
    commands: [tests, lint, format, types]
  research:
    modify_files: false
    run_commands: false
    spawn_agents: false
    commands: []
  critical_review:
    modify_files: false
    run_commands: true
    spawn_agents: false
    commands: []
  recovery:
    modify_files: false
    run_commands: false
    spawn_agents: false
    commands: []
files:
  read_only:
  - .git
  - .ai/STATE.yaml
  - .ai/framework.yaml
  - .ai/constraints
  - .ai/agents
  - .ai/workflows
  forbidden:
  - .env
  - .env.*
  - '**/*.pem'
  - '**/*.key'
  generated: []
  preserve: []
external_actions:
  commit: allow
  push: approval
  pull_request: approval
  merge: approval
  release: approval
  deployment: approval
  paid_service: approval
  credentials: approval
  provider_execution: approval
  branch_retirement: allow
  obsolete_content_deletion: approval
workflow:
  validation_before_review: true
  review_before_pr: true
  dependencies_before_start: true
  reviewer_read_only: true
  independent_reviewer: true
  cleanup_requires_evidence: true
  planning_artifacts_under_ai: true
  plan_requires_tasks_and_features: true
cleanup:
  merged_worktree_retirement: allow
  obsolete_content_deletion: approval

