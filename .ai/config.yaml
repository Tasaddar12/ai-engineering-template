# Project-level configuration for the .ai/ orchestration structure.
# Edit this once when you drop the template into a project.

project:
  name: ai-engineering-template
  # One line. What this project is, for an agent that has never seen it.
  summary: Markdown instructions and records for approved engineering orchestration.

# ---------------------------------------------------------------------------
# mode — how much process this project gets. Same template either way; the
# mode decides which documents are required and which commands are in play.
#
#   light     Small or short-lived work. One plan at a time in plans/active/.
#             A consuming project may keep acceptance criteria in its plans.
#             Agents in play: implementor, verifier.
#             Skip: spec creation and plan-checker when the chosen scope permits.
#
#   standard  Default. Specs are the contract; plans move through the full
#             lifecycle; amendments are recorded.
#             Agents in play: planner, plan-checker, implementor, verifier, scribe.
#
# Only light and standard are supported by the supplied roles and commands.
# ---------------------------------------------------------------------------
mode: standard

# Where things live. Paths are relative to the repository root.
# Change these only if the project already has a conflicting convention.
paths:
  project: .ai/state/PROJECT.md
  specs: .ai/specs
  decisions: .ai/decisions
  amendments: .ai/decisions/amendments
  retired: .ai/decisions/retired
  meetings: .ai/decisions/meetings
  plans: .ai/plans
  fixes: .ai/fixes
  state: .ai/state
  journal: .ai/state/journal
  orchestration: .ai/state/orchestration
  research: .ai/research
  agents: .ai/agents
  commands: .ai/commands
  # Reserved directories; only .gitkeep placeholders are supplied.
  policies: .ai/policies
  gates: .ai/gates
  hooks: .ai/hooks
  templates: .ai/templates
  docs: docs

# Plan lifecycle stages, in order. A plan's stage is the directory it sits in.
# `done` is partitioned by period so it stays browsable for years.
lifecycle:
  stages: [intake, backlog, active, blocked, review, done, abandoned]
  # Concurrency guidance, not enforcement. Exceeding it is a smell worth
  # mentioning to the user, not an error.
  max_active: 2
  done_partition: quarter   # quarter | month | year  -> done/2026-Q3/

  # Bug fixes run a shorter lifecycle of the same kind — the stage is still the
  # directory. A fix restores conformance with the contract; anything that
  # changes what conformance means is a plan. See .ai/RULES.md#bug-fixes.
  # Fixes are live in every mode, light included.
  fix_stages: [open, done]

# Identifier formats. Numbers are zero-padded and allocated by taking the
# highest issued number in current files, Git history and reserved run blocks.
# Never reuse a deleted identifier; allocate sibling track blocks before branching.
ids:
  spec: SPEC-{nnn}-{slug}
  plan: PLAN-{nnn}-{slug}
  decision: ADR-{nnnn}-{slug}
  amendment: AMD-{nnn}-{slug}
  intake: INTAKE-{nnn}-{slug}
  fix: FIX-{nnn}-{slug}
  research: RES-{nnn}-{slug}
  orchestration: ORCH-{nnn}
  meeting: MEET-{date}-{slug}
  journal: "{date}"

# The tier reminder is advisory. No hook is registered by this YAML file.
# The optional confinement example can deny some writes in a compatible host;
# it is not a sandbox. See .ai/hooks/README.md.
enforcement: advisory

# Commands the verifier should run to check reality. Fill these in per project;
# an empty list means the verifier inspects behavior manually and says so.
verification:
  commands:
    - git diff --check
    # - pytest -q
    # - npm test
    # - ruff check .

# ---------------------------------------------------------------------------
# orchestration — settings for /orchestrate, which builds several plans at once
# in parallel git worktrees. See docs/ORCHESTRATION.md for the whole flow.
#
# Vocabulary, because the rest of this block is meaningless without it:
#   run    One /orchestrate invocation. ORCH-{nnn}, manifest in state/.
#   wave   A dependency layer. After the prior wave is terminal, start only
#          tracks whose own prerequisites have merged; park blocked dependents.
#   track  A group of plans sharing one worktree, one branch, one PR. Plans in
#          a track run in sequence; tracks in a wave run in parallel.
# ---------------------------------------------------------------------------
orchestration:
  # Where worktrees are created, relative to the repository root. This path
  # MUST be in .gitignore — a worktree committed into the base branch is a
  # mess to unpick.
  worktree_root: .worktrees

  # Manual dispatch: open a separate host session rooted in each assigned
  # worktree and give it .ai/commands/orchestrate-track.md plus run/track IDs.
  # Background dispatch requires a separately configured, tested launcher,
  # permissions and completion signaling. This repository supplies none.
  dispatch: manual         # manual | background (host integration required)

  # How many tracks may be in flight at once within a wave. This is the real
  # cost dial: each track is a full pipeline of subagents. Raising it past the
  # number of genuinely independent plans buys nothing.
  max_parallel_tracks: 3

  # Branch the run starts from and merges back into. Empty means whatever
  # branch /orchestrate was invoked on.
  base_branch: main

  # Branch naming for tracks. {run} -> ORCH-007, {track} -> w1t2
  branch_prefix: orch

  # review — the fix/re-review loop after a PR opens.
  review:
    # Hard ceiling on review rounds before the run stops and asks for a human.
    # Round 1 is the first review. Three rounds of an agent failing to satisfy
    # a reviewer means the problem is not one more round will solve.
    max_rounds: 3
    # Only findings at or above this severity restart the loop. Everything
    # below is captured as an INTAKE item and does not block the merge —
    # without this line the loop never terminates on style disagreements.
    blocking_severity: major   # critical | major | minor

  # forge — where the pull request or merge request is opened.
  #   auto    Detect from `git remote get-url origin`: github.com or a
  #           GitHub Enterprise host -> gh; gitlab.com or a self-hosted GitLab
  #           -> glab. Falls back to `none` if neither CLI is present or authed.
  #   none    Skip PR creation. Report local review results; do not silently
  #           substitute a local merge for a requested PR delivery.
  forge: github            # auto | github | gitlab | none

  # How a cleared track lands. `squash` keeps the base branch history one
  # commit per track; `merge` preserves the per-step commits the implementor
  # made, which is usually what you want when reviewing agent work later.
  merge_strategy: merge    # squash | merge | rebase

  # Applies to the scheduler, which is the only thing that merges — a track
  # never merges itself, so an `ask` here cannot hang an unattended track.
  #   ask     Ask once per wave only if the user has not already authorized it.
  #   auto    Merge cleared tracks only under existing user merge authority.
  #   never   Leave the PR open and report it. Nothing is merged.
  auto_merge: ask          # ask | auto | never

  # Remove the worktree and delete the track branch after a successful merge.
  # Worktrees for tracks that stopped for a human are always kept.
  cleanup_on_merge: true

  # Commands the track pipeline may use to run only the tests affected by a
  # change. Left empty, agents fall back to `verification.commands` in full and
  # say that they did. {files} is replaced with the changed paths.
  targeted_tests: []
    # - pytest -q {files}
    # - npm test -- --findRelatedTests {files}
