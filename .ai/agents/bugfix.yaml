name: bugfix
prompt_template: agents/bugfix.md
model_profile: coding_medium
assignment_template: handoffs/bug-to-bugfix-agent.md
output_template: handoffs/agent-investigation.md
permissions:
  modify_files: true
  run_commands: true
  spawn_agents: false
expected_inputs:
- assignment
- context_refs
- constraints
constraints:
- coding
- commands
- files
- workflow
- external_actions
max_concurrency: 3
output_schema:
  statuses:
  - INVESTIGATED
  - ESCALATE
  fields:
    subject: string
    session_id: string
    status: string
    summary: string
    reproduction: string
    root_cause: string
    expected_behavior: string
    regression_strategy: string
    scope: list
    acceptance: list
    validation: list
    escalation: mapping
default_phase: investigation
phases:
  investigation:
    permissions:
      modify_files: false
    output_template: handoffs/agent-investigation.md
    output_schema:
      statuses:
      - INVESTIGATED
      - ESCALATE
      fields:
        subject: string
        session_id: string
        status: string
        summary: string
        reproduction: string
        root_cause: string
        expected_behavior: string
        regression_strategy: string
        scope: list
        acceptance: list
        validation: list
        escalation: mapping
  fix:
    permissions:
      modify_files: true
    output_template: handoffs/agent-completion.md
    output_schema:
      statuses:
      - COMPLETE
      - STRUCTURAL_FAILURE
      fields:
        subject: string
        session_id: string
        status: string
        summary: string
        changed_files: list
        tasks_completed: list
        validation: list
        documentation: string
        assumptions: list
        deviations: list
        structural_issues: list
