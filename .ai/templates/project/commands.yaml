commands:
  tests:
    argv:
    - python
    - -m
    - pytest
    - -q
    timeout: 1800
  lint:
    argv:
    - python
    - -m
    - ruff
    - check
    - src/ai_engineering
    - tests
    timeout: 120
  format:
    argv:
    - python
    - -m
    - ruff
    - format
    - --check
    - src/ai_engineering
    - tests
    timeout: 120
  types:
    argv:
    - python
    - -m
    - mypy
    - src/ai_engineering
    timeout: 120
