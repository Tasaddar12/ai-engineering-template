# Canonical project configuration. Read with engineer_run query config-get KEY.
# Initialize during onboarding. Keep reusable templates free of adopting-project identity.
commit_docs: true
response_language: null
# Set this to the actual model window; the independent absolute handoff cap still applies.
context_window: 1000000
workflow:
  text_mode: false
  auto_advance: false
  discuss_mode: discuss
  # auto resolves only to harness-worktree or orchestrator-worktree; isolation cannot be disabled.
  isolation: auto
  agent_hint_routing: true
  human_verify_mode: end-of-phase
  code_review: true
  code_review_depth: standard
  code_review_depth_overrides: []
  context_coverage_gate: true
  live_dom_uat: false
  mvp_mode: false
  plan_chunked: false
  security_asvs_level: 1
  security_block_on: high
  security_enforcement: true
  specless_probe_fallback: true
  ui_interaction_capture: false
  ui_phase: auto
  # Only explicit false disables the registry-safety dimension; disabled is not passed.
  ui_safety_gate: true
  nyquist_validation: true
  tdd_mode: false
  research: true
  plan_check: true
  verifier: true
executor:
  stall_detect_interval_minutes: 5
  stall_threshold_minutes: 10
planner:
  stall_detection_enabled: true
  stall_detect_interval_minutes: 5
  stall_threshold_minutes: 10
quick_batch:
  capacity: 3
worktree:
  directory: .worktrees
  # root is retained as the requested project convention; directory is the current runtime key.
  root: .worktrees
  branch_prefix: codex/
handoff:
  enabled: true
  context_percent: 60
  context_tokens: 250000
codebase:
  max_age_commits: 20
  # Map-specific preservation policy.
  staleness:
    architecture: 15
    stack: 1
# Resolve final-role model and effort with engineer_run query resolve-model / resolve-effort.
# Preserved project-level Claude choices, with final role names. Codex uses native
# installed TOML instead of these YAML choices. Native Claude frontmatter still
# applies when an effective value is explicitly inherit.
# Fixed scout and targeted-fixer policies cannot be overridden by project configuration.
# Code-fixer is method source; targeted-fixer is the dispatchable bounded-repair role.
agents:
  executor:
    model: sonnet
    effort: high
  debugger:
    model: sonnet
    effort: high
  doc-writer:
    model: sonnet
    effort: high
  planner:
    model: opus
    effort: medium
  codebase-mapper:
    model: sonnet
    effort: high
  phase-researcher:
    model: opus
    effort: high
  code-reviewer:
    model: opus
    effort: high
  verifier:
    model: opus
    effort: high
  plan-checker:
    model: opus
    effort: high
  doc-verifier:
    model: sonnet
    effort: medium
  integration-checker:
    model: sonnet
    effort: medium
verification:
  # CHANGEME: configure actual project checks during onboarding. No invented test commands.
  commands: []
  # Example only, replace with this project's real argv and inputs:
  # commands:
  #   - id: unit
  #     argv: ["python", "-m", "unittest", "discover", "-s", "tests"]
  #     timeout: 300
  #     inputs: ["src/app.py", "tests/test_app.py"]
  reuse: true
  max_parallel: 4
git:
  base_branch: main
  protected_branches: [main, master]
