[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-framework"
version = "0.1.0.dev0"
description = "Foundation for a local-first plan-driven AI engineering framework"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.18,<5"]

[tool.setuptools.packages.find]
where = ["src"]
