[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-framework"
version = "0.2.0"
description = "Constrained, feature-based AI engineering orchestration"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "types-PyYAML", "build"]

[project.scripts]
ai = "ai_engineering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_engineering", "ai_engineering.*"]
namespaces = true

[tool.setuptools.package-data]
ai_engineering = ["templates/**/*.md", "templates/**/*.yaml", "definitions/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
