[build-system]
requires = ["setuptools>=68"]
build-backend = "build_backend"
backend-path = ["src"]

[project]
name = "ai-engineering-framework"
version = "0.3.0"
description = "Constrained, resumable AI engineering workflows"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "types-PyYAML", "build"]

[project.scripts]
ai = "ai_engineering.cli:main"

[tool.setuptools]
packages = ["ai_engineering"]
package-dir = { ai_engineering = "src" }
include-package-data = true

[tool.setuptools.package-data]
ai_engineering = ["_assets/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
