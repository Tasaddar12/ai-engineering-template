[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-framework"
version = "0.2.0.dev0"
description = "Local bootstrap toolkit for focused, plan-driven AI engineering"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = ["jsonschema>=4.18,<5"]

[project.scripts]
ai-workflow = "ai:main"
ai-workflow-validate = "validate_foundation:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["ai", "install", "validate_foundation"]
