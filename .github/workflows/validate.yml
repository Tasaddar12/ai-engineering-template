name: Validate phase workflows

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: phase tests (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Windows Git/process suite reaches ~20 minutes with recovery coverage;
    # retain room for its final tests and both hook suites. Per-test limits stay intact.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select native Git Bash on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source)
          $gitTools = Join-Path $gitRoot 'usr/bin'
          if (-not (Test-Path (Join-Path $gitTools 'bash.exe'))) { throw 'Git Bash is unavailable' }
          $gitTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -r tests/requirements.txt
      - run: python -I -B scripts/overhaul/no_node.py
      - run: python -I -B scripts/overhaul/verbs.py --fail-on-unknown
      - run: python -B scripts/run-tests.py --workers 4 --output-dir '${{ runner.temp }}/engineer-test-results'
      - run: bash tests/hooks/ai-tier-notice.test.sh
      - run: bash tests/hooks/context-handoff.test.sh
      - run: bash tests/hooks/worktree-location.test.sh

  # Keep the existing branch-protection context while checking both platforms.
  validate:
    name: validate
    needs: platform
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both platform suites
        env:
          PHASE_PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PHASE_PLATFORM_RESULT" = success
