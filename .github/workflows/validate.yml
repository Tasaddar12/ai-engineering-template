name: Validate phase workflows

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: phase tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Windows Git/process suite reaches ~27 minutes with recovery and gsd-core
    # parity coverage; retain room for its final tests and the hook suites. Per-test limits stay intact.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r .ai/runtime/requirements.txt
      - run: python -m pip install -r engineer/bin/requirements.txt
      - name: Exercise Python script and hook entrypoints
        run: python -m unittest discover -s tests -p "test_python_*.py" -v
      - name: Exercise owned process startup and descendant termination
        run: python -m unittest discover -s tests -p "test_runtime_processes.py" -v
      - run: python -m unittest discover -s tests -v
      - run: bash .ai/hooks/ai-tier-notice.test.sh
      - run: bash .ai/hooks/worktree-guard.test.sh
      - run: bash .ai/hooks/context-handoff.test.sh
      - run: bash .ai/hooks/worktree-location.test.sh

  # Keep the existing branch-protection context while checking both platforms.
  validate:
    name: validate
    needs: platform
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both platform suites
        env:
          PHASE_PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PHASE_PLATFORM_RESULT" = success
