name: Validate phase workflows

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: phase tests (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Windows Git/process suite reaches ~20 minutes with recovery coverage;
    # retain room for its final tests and both hook suites. Per-test limits stay intact.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r .ai/runtime/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: bash .ai/hooks/ai-tier-notice.test.sh
      - run: bash .ai/hooks/worktree-guard.test.sh
      - run: bash .ai/hooks/context-handoff.test.sh
      - run: bash .ai/hooks/worktree-location.test.sh

  # Keep the existing branch-protection context while checking both platforms.
  validate:
    name: validate
    needs: platform
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both platform suites
        env:
          PHASE_PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PHASE_PLATFORM_RESULT" = success
