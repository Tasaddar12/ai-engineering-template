name: Validate phase workflows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r .ai/runtime/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: bash .ai/hooks/worktree-confine.test.sh
      - run: bash .ai/hooks/ai-tier-notice.test.sh
